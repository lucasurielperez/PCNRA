<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Escondidas</title>
  <style>
    body { margin: 0; overflow: hidden; display: grid; place-items: center; min-height: 100vh; background: #dff4ff; font-family: Arial, sans-serif; }
    canvas { display: none; width: 100vw; height: 100vh; cursor: pointer; touch-action: manipulation; }
    #startButton { font-size: clamp(1.2rem, 4vw, 1.6rem); padding: 18px 36px; background: #4caf50; color: white; border: 0; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 0 #2d7d32; }
    #startButton:hover { background: #45a049; }
  </style>
</head>
<body>
  <button id="startButton" type="button">Comenzar a buscar</button>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startButton = document.getElementById('startButton');
    const catalog = [
      ['⚽', 'pelota', ['#ffffff', '#222222']], ['🌳', 'árbol', ['#228b22', '#8b4513']], ['🏠', 'casa', ['#d2691e', '#b22222']], ['📺', 'televisor', ['#333333', '#87ceeb']], ['🛏️', 'cama', ['#ffffff', '#8b4513']],
      ['🚪', 'ropero', ['#a0522d', '#deb887']], ['🚗', 'auto', ['#e53935', '#263238']], ['🚲', 'bicicleta', ['#e53935', '#222222']], ['🎁', 'regalo', ['#e91e63', '#ffd54f']], ['🎸', 'guitarra', ['#d2691e', '#5d4037']],
      ['🍎', 'manzana', ['#e53935', '#43a047']], ['🌻', 'flor', ['#fdd835', '#6d4c41']], ['🚀', 'cohete', ['#eeeeee', '#e53935', '#1565c0']], ['☂️', 'paraguas', ['#1976d2', '#333333']], ['🐘', 'elefante', ['#9e9e9e', '#616161']]
    ];
    let objects = [], hidingObject, roundStartedAt = 0, gameStarted = false, confetti = [], kidSize = 100, kid = { x: 0, y: 0 }, peekRatio = .18, peekPhase = -1, foundUntil = 0, peekGuide = null;

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; if (gameStarted) newRound(); }
    function randomBetween(min, max) { return min + Math.random() * (max - min); }
    function shuffled(items) { return [...items].sort(() => Math.random() - .5); }
    function overlaps(a, b, gap = 18) { return a.x - a.w / 2 - gap < b.x + b.w / 2 && a.x + a.w / 2 + gap > b.x - b.w / 2 && a.y - a.h / 2 - gap < b.y + b.h / 2 && a.y + a.h / 2 + gap > b.y - b.h / 2; }

    function makeObject([icon, name, colors]) {
      const screen = Math.min(canvas.width, canvas.height);
      const fontSize = Math.max(44, Math.min(screen * randomBetween(.13, .22), canvas.width * .25, canvas.height * .25));
      return { icon, name, colors, fontSize, w: fontSize * 1.05, h: fontSize * 1.08, x: 0, y: 0, hidden: false };
    }

    function placeObject(obj, placed) {
      const padding = 12;
      for (let attempt = 0; attempt < 400; attempt++) {
        obj.x = randomBetween(obj.w / 2 + padding, canvas.width - obj.w / 2 - padding);
        obj.y = randomBetween(obj.h / 2 + padding, canvas.height - obj.h / 2 - padding);
        if (!placed.some(other => overlaps(obj, other))) return true;
      }
      return false;
    }

    function newRound() {
      const wanted = Math.random() < .5 ? 6 : 7;
      const selected = shuffled(catalog).slice(0, wanted).map(makeObject);
      const placed = [];
      selected.forEach(obj => { if (placeObject(obj, placed)) placed.push(obj); });
      // En pantallas muy pequeñas se prioriza que ningún objeto se superponga.
      objects = placed;
      hidingObject = objects[Math.floor(Math.random() * objects.length)];
      kidSize = hidingObject.fontSize * randomBetween(.68, .82);
      kid.x = hidingObject.x;
      roundStartedAt = performance.now();
      peekPhase = -1;
      foundUntil = 0;
    }

    function drawKid(x, y, size, dancing = false, now = 0) {
      ctx.save(); ctx.translate(x, y);
      if (dancing) { ctx.translate(Math.sin(now / 95) * size * .16, Math.abs(Math.sin(now / 120)) * -size * .12); ctx.rotate(Math.sin(now / 130) * .18); }
      ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(dancing ? '🕺' : '🧒', 0, 0);
      ctx.restore();
    }

    function drawPeek(now) {
      // 0-3 s oculto; 3-6 s asoma una parte pequeña y reconocible; el ciclo se repite.
      const phase = Math.floor((now - roundStartedAt) / 3000);
      if (phase % 2 === 0) return;
      if (phase !== peekPhase) { peekPhase = phase; peekRatio = randomBetween(.15, .23); }
      // Un mínimo de 10 px evita que el asomo sea imperceptible en celulares.
      const visible = Math.max(10, kidSize * peekRatio);
      const top = hidingObject.y - hidingObject.h / 2;
      // La parte restante del personaje queda dentro del área del objeto.
      kid.y = top + kidSize * .47 - visible;
      ctx.save();
      ctx.beginPath(); ctx.rect(kid.x - kidSize / 2, top - visible, kidSize, visible); ctx.clip();
      // El niño se dibuja primero: el objeto queda siempre delante de él.
      drawKid(kid.x, kid.y, kidSize);
      ctx.restore();
      peekGuide = { x: kid.x, top, visible };
    }

    function drawPeekGuide() {
      if (!peekGuide) return;
      const { x, top, visible } = peekGuide;
      ctx.save();
      ctx.strokeStyle = '#ff00a8'; ctx.lineWidth = 5; ctx.setLineDash([8, 5]);
      ctx.strokeRect(x - kidSize / 2 - 7, top - visible - 7, kidSize + 14, visible + 14); ctx.setLineDash([]);
      const arrowX = x + kidSize / 2 + 26, arrowY = top - visible / 2;
      ctx.fillStyle = '#ff00a8'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('← ¡ACÁ ASOMA!', arrowX, arrowY);
      ctx.restore();
    }

    function drawObject(obj) {
      if (obj.hidden) return;
      ctx.save(); ctx.font = `${obj.fontSize}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(obj.icon, obj.x, obj.y); ctx.restore();
    }

    function addConfetti(x, y) { for (let i = 0; i < 40; i++) confetti.push({ x, y, vx: randomBetween(-5, 5), vy: randomBetween(-8, -2), life: 55, color: `hsl(${Math.random() * 360} 85% 55%)` }); }
    function drawConfetti() { confetti = confetti.filter(c => c.life-- > 0); confetti.forEach(c => { c.x += c.vx; c.y += c.vy; c.vy += .22; ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, 7, 7); }); }
    function drawColorHint() {
      if (performance.now() - roundStartedAt < 10000 || hidingObject.hidden) return;
      const boxW = Math.min(250, canvas.width - 32), boxH = 78;
      ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fillRect(16, 16, boxW, boxH);
      ctx.strokeStyle = '#16324f'; ctx.lineWidth = 2; ctx.strokeRect(16, 16, boxW, boxH);
      ctx.fillStyle = '#16324f'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText('Pista: colores del escondite', 28, 41);
      hidingObject.colors.forEach((color, index) => { ctx.beginPath(); ctx.arc(43 + index * 48, 62, 14, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#16324f'; ctx.stroke(); });
    }

    function drawScene(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#dff4ff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      peekGuide = null;
      if (hidingObject && !hidingObject.hidden && now >= foundUntil) drawPeek(now);
      objects.forEach(drawObject);
      drawPeekGuide();
      if (now < foundUntil) drawKid(hidingObject.x, hidingObject.y, kidSize * 1.15, true, now);
      drawConfetti();
      if (hidingObject && !hidingObject.hidden) drawColorHint();
    }

    function startGame() { gameStarted = true; startButton.style.display = 'none'; canvas.style.display = 'block'; resizeCanvas(); }
    canvas.addEventListener('click', event => {
      const rect = canvas.getBoundingClientRect(), scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
      const x = (event.clientX - rect.left) * scaleX, y = (event.clientY - rect.top) * scaleY;
      const hit = objects.find(obj => !obj.hidden && x > obj.x - obj.w / 2 && x < obj.x + obj.w / 2 && y > obj.y - obj.h / 2 && y < obj.y + obj.h / 2);
      if (!hit) return;
      hit.hidden = true;
      if (hit === hidingObject) {
        addConfetti(hit.x, hit.y);
        foundUntil = performance.now() + 1800;
        setTimeout(newRound, 1800);
      }
    });
    function animate(now) { if (gameStarted) drawScene(now); requestAnimationFrame(animate); }
    window.addEventListener('resize', resizeCanvas); startButton.addEventListener('click', startGame); animate();
  </script>
</body>
</html>
