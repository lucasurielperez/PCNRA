<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Escondidas</title>
  <style>
    body { margin: 0; overflow: hidden; display: grid; place-items: center; min-height: 100vh; background: #dff4ff; font-family: Arial, sans-serif; }
    canvas { display: none; width: 100vw; height: 100vh; cursor: pointer; touch-action: manipulation; }
    #startButton, #adminButton { font-size: clamp(1.05rem, 4vw, 1.5rem); padding: 16px 30px; color: white; border: 0; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 0 #2d7d32; }
    #startButton { background: #4caf50; } #startButton:hover { background: #45a049; }
    #adminButton { position: fixed; right: 18px; top: 18px; z-index: 5; background: #285b8f; box-shadow: 0 4px 0 #183e63; font-size: .95rem; padding: 10px 15px; }
    #adminPanel { position: fixed; z-index: 10; inset: 5vh 5vw; overflow: auto; padding: 22px; border-radius: 18px; background: #fffdf8; color: #16324f; box-shadow: 0 16px 50px rgba(0,0,0,.35); }
    #adminPanel[hidden] { display: none; } #adminPanel h2 { margin: 0 0 6px; } #adminPanel p { margin: 0 0 16px; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 18px; }
    .admin-option { display: flex; align-items: center; gap: 7px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; }
    .admin-option span { font-size: 1.35rem; } .admin-actions { display: flex; gap: 10px; position: sticky; bottom: 0; padding-top: 12px; background: #fffdf8; }
    .admin-actions button { padding: 11px 16px; border: 0; border-radius: 8px; font-weight: bold; cursor: pointer; } #saveAdmin { background: #4caf50; color: white; } #closeAdmin { background: #dce5ee; }
  </style>
</head>
<body>
  <button id="startButton" type="button">Comenzar a buscar</button>
  <button id="adminButton" type="button">⚙️ Admin</button>
  <aside id="adminPanel" hidden aria-label="Configuración del juego">
    <h2>Configuración</h2><p>Elegí qué objetos y personajes pueden aparecer en la próxima ronda.</p>
    <h3>Objetos</h3><div id="objectOptions" class="admin-grid"></div>
    <h3>Personajes blocky</h3><div id="characterOptions" class="admin-grid"></div>
    <div class="admin-actions"><button id="saveAdmin" type="button">Aplicar selección</button><button id="closeAdmin" type="button">Cancelar</button></div>
  </aside>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startButton = document.getElementById('startButton');
    const catalog = [
      ['⚽', 'pelota', ['#ffffff', '#222222']], ['🌳', 'árbol', ['#228b22', '#8b4513']], ['🏠', 'casa', ['#d2691e', '#b22222']], ['📺', 'televisor', ['#333333', '#87ceeb']], ['🛏️', 'cama', ['#ffffff', '#8b4513']],
      ['🚪', 'ropero', ['#a0522d', '#deb887']], ['🚗', 'auto', ['#e53935', '#263238']], ['🎁', 'regalo', ['#e91e63', '#ffd54f']],
      ['🍎', 'manzana', ['#e53935', '#43a047']], ['🌻', 'flor', ['#fdd835', '#6d4c41']], ['🚀', 'cohete', ['#eeeeee', '#e53935', '#1565c0']], ['☂️', 'paraguas', ['#1976d2', '#333333']], ['🐘', 'elefante', ['#9e9e9e', '#616161']],
      ['🐶', 'perro', ['#a66b3d', '#ffffff']], ['🚌', 'colectivo', ['#fbc02d', '#263238']], ['🧸', 'oso de peluche', ['#a66b3d', '#f5d6a0']], ['🎂', 'torta', ['#f8bbd0', '#ffffff']], ['🐱', 'gato', ['#ff9800', '#ffffff']],
      ['🎲', 'dado', ['#ffffff', '#222222']], ['📦', 'caja', ['#c47b38', '#5d4037']], ['🍪', 'galleta', ['#d99145', '#5d4037']], ['⏰', 'reloj', ['#f6d743', '#ffffff']], ['🔵', 'pelota azul', ['#1976d2', '#0d47a1']], ['🧱', 'bloque', ['#c75b39', '#8d3928']]
    ];
    const characterCatalog = [
      { id: 'steve', name: 'Aventurero', skin: '#f1c27d', hair: '#5d4037', shirt: '#26a69a', pants: '#3949ab' },
      { id: 'alex', name: 'Exploradora', skin: '#f1c27d', hair: '#e67e22', shirt: '#6d9eeb', pants: '#4b3f72' },
      { id: 'creeper', name: 'Creeper', skin: '#49a942', hair: '#2d7b2e', shirt: '#49a942', pants: '#49a942' },
      { id: 'enderman', name: 'Enderman', skin: '#25212b', hair: '#25212b', shirt: '#25212b', pants: '#25212b' },
      { id: 'villager', name: 'Aldeano', skin: '#a86d48', hair: '#7c4f32', shirt: '#8f5a3c', pants: '#5e4a42' }
    ];
    const selectedObjectNames = new Set(catalog.map(([, name]) => name));
    const selectedCharacterIds = new Set(characterCatalog.map(({ id }) => id));
    const adminButton = document.getElementById('adminButton'), adminPanel = document.getElementById('adminPanel');
    const objectOptions = document.getElementById('objectOptions'), characterOptions = document.getElementById('characterOptions');
    let objects = [], hidingObject, roundStartedAt = 0, gameStarted = false, confetti = [], kidSize = 100, kid = { x: 0, y: 0, character: characterCatalog[0] }, foundUntil = 0;

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; if (gameStarted) newRound(); }
    function randomBetween(min, max) { return min + Math.random() * (max - min); }
    function shuffled(items) { return [...items].sort(() => Math.random() - .5); }
    function overlaps(a, b, gap = 18) { return a.x - a.w / 2 - gap < b.x + b.w / 2 && a.x + a.w / 2 + gap > b.x - b.w / 2 && a.y - a.h / 2 - gap < b.y + b.h / 2 && a.y + a.h / 2 + gap > b.y - b.h / 2; }
    function renderAdmin() {
      objectOptions.innerHTML = catalog.map(([icon, name]) => `<label class="admin-option"><input type="checkbox" value="${name}" ${selectedObjectNames.has(name) ? 'checked' : ''}><span>${icon}</span>${name}</label>`).join('');
      characterOptions.innerHTML = characterCatalog.map(character => `<label class="admin-option"><input type="checkbox" value="${character.id}" ${selectedCharacterIds.has(character.id) ? 'checked' : ''}><span>🧱</span>${character.name}</label>`).join('');
    }
    function showAdmin() { renderAdmin(); adminPanel.hidden = false; }
    function saveAdmin() {
      const chosenObjects = [...objectOptions.querySelectorAll('input:checked')], chosenCharacters = [...characterOptions.querySelectorAll('input:checked')];
      if (!chosenObjects.length || !chosenCharacters.length) { alert('Elegí al menos un objeto y un personaje.'); return; }
      selectedObjectNames.clear(); chosenObjects.forEach(input => selectedObjectNames.add(input.value));
      selectedCharacterIds.clear(); chosenCharacters.forEach(input => selectedCharacterIds.add(input.value));
      adminPanel.hidden = true; if (gameStarted) newRound();
    }

    function makeObject([icon, name, colors]) {
      const screen = Math.min(canvas.width, canvas.height);
      const fontSize = Math.max(76, Math.min(screen * randomBetween(.24, .34), canvas.width * .38, canvas.height * .30));
      return { icon, name, colors, fontSize, w: fontSize * 1.05, h: fontSize * 1.08, x: 0, y: 0, hidden: false };
    }

    function animatedPosition(obj, now) {
      const amplitude = Math.min(3, obj.fontSize * .0175);
      const speed = 1250 + (objects.indexOf(obj) % 5) * 220;
      return { x: obj.x + Math.sin(now / speed + obj.x) * amplitude, y: obj.y + Math.cos(now / (speed * .9) + obj.y) * amplitude };
    }

    function placeObject(obj, placed) {
      const padding = 12;
      for (let attempt = 0; attempt < 400; attempt++) {
        obj.x = randomBetween(obj.w / 2 + padding, canvas.width - obj.w / 2 - padding);
        obj.y = randomBetween(obj.h / 2 + padding, canvas.height - obj.h / 2 - padding);
        if (!placed.some(other => overlaps(obj, other))) return true;
      }
      return false;
    }

    function newRound() {
      const allowedObjects = catalog.filter(([, name]) => selectedObjectNames.has(name));
      const allowedCharacters = characterCatalog.filter(({ id }) => selectedCharacterIds.has(id));
      const wanted = Math.min(allowedObjects.length, Math.random() < .5 ? 6 : 7);
      const selected = shuffled(allowedObjects).slice(0, wanted).map(makeObject);
      const placed = [];
      selected.forEach(obj => { if (placeObject(obj, placed)) placed.push(obj); });
      // En pantallas muy pequeñas se prioriza que ningún objeto se superponga.
      objects = placed;
      hidingObject = objects[Math.floor(Math.random() * objects.length)];
      // Es deliberadamente más pequeño que la parte que lo cubre (rueda, tronco, puerta, etc.).
      kidSize = hidingObject.fontSize * randomBetween(.30, .38);
      kid.x = hidingObject.x;
      kid.character = allowedCharacters[Math.floor(Math.random() * allowedCharacters.length)];
      roundStartedAt = performance.now();
      foundUntil = 0;
    }

    function drawKid(x, y, size, dancing = false, now = 0, alpha = 1) {
      ctx.save(); ctx.translate(x, y);
      if (dancing) { ctx.translate(Math.sin(now / 95) * size * .08, Math.abs(Math.sin(now / 120)) * -size * .06); ctx.rotate(Math.sin(now / 130) * .09); }
      ctx.globalAlpha = alpha;
      const unit = size / 8, character = kid.character;
      ctx.fillStyle = character.pants; ctx.fillRect(-2 * unit, 1 * unit, 1.8 * unit, 3 * unit); ctx.fillRect(.2 * unit, 1 * unit, 1.8 * unit, 3 * unit);
      ctx.fillStyle = character.shirt; ctx.fillRect(-2.2 * unit, -1.2 * unit, 4.4 * unit, 2.4 * unit); ctx.fillRect(-3 * unit, -1 * unit, .8 * unit, 2.4 * unit); ctx.fillRect(2.2 * unit, -1 * unit, .8 * unit, 2.4 * unit);
      ctx.fillStyle = character.skin; ctx.fillRect(-2 * unit, -4 * unit, 4 * unit, 3 * unit);
      ctx.fillStyle = character.hair; ctx.fillRect(-2 * unit, -4 * unit, 4 * unit, .65 * unit); ctx.fillRect(-2 * unit, -3.35 * unit, .65 * unit, 1.2 * unit);
      if (character.id === 'creeper') { ctx.fillStyle = '#173d1c'; ctx.fillRect(-1.1 * unit, -3 * unit, .75 * unit, .75 * unit); ctx.fillRect(.35 * unit, -3 * unit, .75 * unit, .75 * unit); ctx.fillRect(-.45 * unit, -2.2 * unit, .9 * unit, .85 * unit); }
      else if (character.id === 'enderman') { ctx.fillStyle = '#e675f3'; ctx.fillRect(-1.3 * unit, -2.75 * unit, .8 * unit, .3 * unit); ctx.fillRect(.5 * unit, -2.75 * unit, .8 * unit, .3 * unit); }
      else { ctx.fillStyle = '#242424'; ctx.fillRect(-1.15 * unit, -2.75 * unit, .5 * unit, .5 * unit); ctx.fillRect(.65 * unit, -2.75 * unit, .5 * unit, .5 * unit); }
      ctx.restore();
    }

    function hidingPlace(obj, now) {
      // Puntos que corresponden a partes opacas y reconocibles de cada emoji.
      const offsets = {
        '🚗': [-.24, .15], '🌳': [0, .19], '🏠': [0, .16], '📺': [0, .08],
        '🛏️': [.12, .12], '🚪': [0, .05], '⚽': [0, .04], '🎁': [0, .05],
        '🍎': [0, .04], '🌻': [0, .12], '🚀': [0, .15], '☂️': [0, .08], '🐘': [.12, .12],
        '🐶': [0, .10], '🚌': [-.23, .16], '🧸': [0, .08], '🎂': [0, .08], '🐱': [0, .10],
        '🎲': [0, .05], '📦': [0, .05], '🍪': [0, .05], '⏰': [0, .05], '🔵': [0, .05], '🧱': [0, .05]
      };
      const [dx, dy] = offsets[obj.icon] || [0, 0];
      const position = animatedPosition(obj, now);
      return { x: position.x + obj.fontSize * dx, y: position.y + obj.fontSize * dy };
    }

    function ease(t) { return t * t * (3 - 2 * t); }
    function drawHidingKid(now) {
      // 0–3 s: oculto. 3–4 s: sale. 4–5 s: asoma. 5–6 s: vuelve a entrar.
      const elapsed = (now - roundStartedAt) % 6000;
      if (elapsed < 3000) return;
      const hidden = hidingPlace(hidingObject, now);
      // Cada salida revela 1 px más: comienza casi imperceptible y nunca supera
      // la mitad del asomo anterior, para conservar la dificultad.
      const appearanceNumber = Math.floor((now - roundStartedAt) / 6000);
      const maxPeek = Math.max(3.5, kidSize * .09);
      const peekAmount = Math.min(maxPeek, 1 + appearanceNumber);
      const hidingPosition = animatedPosition(hidingObject, now);
      const visible = { x: hidden.x, y: hidingPosition.y - hidingObject.h / 2 + kidSize * .5 - peekAmount };
      let progress;
      if (elapsed < 4000) progress = ease((elapsed - 3000) / 1000);
      else if (elapsed < 5000) progress = 1;
      else progress = 1 - ease((elapsed - 5000) / 1000);
      kid.x = hidden.x + (visible.x - hidden.x) * progress;
      kid.y = hidden.y + (visible.y - hidden.y) * progress;
      // Se dibuja antes que el objeto: al comenzar y terminar, queda tapado detrás de él.
      drawKid(kid.x, kid.y, kidSize, false, now, progress);
    }

    function drawObject(obj, now) {
      if (obj.hidden) return;
      const position = animatedPosition(obj, now);
      ctx.save(); ctx.font = `${obj.fontSize}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(obj.icon, position.x, position.y); ctx.restore();
    }

    function addConfetti(x, y, count = 20, scale = .5) { for (let i = 0; i < count; i++) confetti.push({ x, y, vx: randomBetween(-5, 5) * scale, vy: randomBetween(-8, -2) * scale, life: 55 * scale, size: 7 * scale, color: `hsl(${Math.random() * 360} 85% 55%)` }); }
    function drawConfetti() { confetti = confetti.filter(c => c.life-- > 0); confetti.forEach(c => { c.x += c.vx; c.y += c.vy; c.vy += .22; ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, c.size, c.size); }); }
    function drawColorHint() {
      if (performance.now() - roundStartedAt < 10000 || hidingObject.hidden) return;
      const boxW = Math.min(250, canvas.width - 32), boxH = 78;
      ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fillRect(16, 16, boxW, boxH);
      ctx.strokeStyle = '#16324f'; ctx.lineWidth = 2; ctx.strokeRect(16, 16, boxW, boxH);
      ctx.fillStyle = '#16324f'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText('Pista: colores del escondite', 28, 41);
      hidingObject.colors.forEach((color, index) => { ctx.beginPath(); ctx.arc(43 + index * 48, 62, 14, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#16324f'; ctx.stroke(); });
    }

    function drawScene(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#dff4ff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (hidingObject && !hidingObject.hidden && now >= foundUntil) drawHidingKid(now);
      objects.forEach(obj => drawObject(obj, now));
      if (now < foundUntil) { const position = animatedPosition(hidingObject, now); drawKid(position.x, position.y, kidSize * 1.15, true, now); }
      drawConfetti();
      if (hidingObject && !hidingObject.hidden) drawColorHint();
    }

    function startGame() { gameStarted = true; startButton.style.display = 'none'; canvas.style.display = 'block'; resizeCanvas(); }
    canvas.addEventListener('click', event => {
      const rect = canvas.getBoundingClientRect(), scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
      const x = (event.clientX - rect.left) * scaleX, y = (event.clientY - rect.top) * scaleY;
      const now = performance.now();
      const hit = objects.find(obj => { const position = animatedPosition(obj, now); return !obj.hidden && x > position.x - obj.w / 2 && x < position.x + obj.w / 2 && y > position.y - obj.h / 2 && y < position.y + obj.h / 2; });
      if (!hit) return;
      hit.hidden = true;
      const hitPosition = animatedPosition(hit, now);
      if (hit === hidingObject) {
        addConfetti(hitPosition.x, hitPosition.y);
        foundUntil = performance.now() + 1800;
        setTimeout(newRound, 1800);
      } else addConfetti(hitPosition.x, hitPosition.y, 6, .225);
    });
    function animate(now) { if (gameStarted) drawScene(now); requestAnimationFrame(animate); }
    adminButton.addEventListener('click', showAdmin);
    document.getElementById('saveAdmin').addEventListener('click', saveAdmin);
    document.getElementById('closeAdmin').addEventListener('click', () => { adminPanel.hidden = true; });
    window.addEventListener('resize', resizeCanvas); startButton.addEventListener('click', startGame); animate();
  </script>
</body>
</html>
